<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shortlink Admin — Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">S</span><div><b>Shortlink</b><small id="status"><i class="dot"></i>Connecting…</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><a href="/">Open the site</a><span id="foot">shortlink-data</span></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
      <h1 id="title">Overview</h1>
      <div class="tools">
        <select id="range" aria-label="Date range">
          <option value="1">Last 24 hours</option><option value="7" selected>Last 7 days</option>
          <option value="30">Last 30 days</option><option value="0">All time</option>
        </select>
        <button id="refresh" class="btn">Refresh</button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script type="text/plain" id="trackerSrc">// Add to your existing track.js. Records country, device, session and screen with every page view.
// Your page_views documents keep the same fields (page, referrer, createdAt) plus the new ones below.
async function getCountry() {
  try {
    const t = await (await fetch("/cdn-cgi/trace")).text();   // works on any site behind Cloudflare
    return (t.match(/^loc=(\w\w)/m) || [])[1] || "";
  } catch { return ""; }
}
function getSession() {
  let s = sessionStorage.getItem("sl_sid");
  if (!s) { s = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem("sl_sid", s); }
  return s;
}
const extra = {
  country: await getCountry(),
  userAgent: navigator.userAgent,
  sessionId: getSession(),
  screen: screen.width + "x" + screen.height,
  language: navigator.language,
  timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
};
// Merge into the object you already pass to addDoc(PAGE_VIEWS_COLLECTION, { page, referrer, createdAt, ...extra })
</script>
</body>
</html>
