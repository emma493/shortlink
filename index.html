<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Clean and modern URL shortener" />
  <title>Shortlink — Shorten your links</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="logo">Short<span class="accent">link</span></div>
      <nav class="nav-links">
        <a href="#">Features</a>
        <a href="#">Pricing</a>
        <a href="#">About</a>
      </nav>
    </div>
  </header>

  <main class="page-body">
    <div class="container">
      <section class="hero">
        <span class="hero-badge">No account required</span>
        <h1>Turn long links into short ones.</h1>
        <p>Paste any URL below and get a clean, shareable short link in seconds.</p>

        <div class="shortener-card">
          <form id="shorten-form" class="stack">
            <div class="input-group">
              <input
                id="url-input"
                type="text"
                placeholder="https://example.com/very-long-link-here"
                required
              />
              <button type="submit" id="shorten-btn" class="btn btn-primary">
                Shorten
              </button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Shortlink. All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
