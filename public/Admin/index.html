<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shortlink Admin — Statistics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="flex items-center justify-between pb-4 border-b border-zinc-800/80">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/></svg>
          </div>
          <div class="truncate">
            <div class="flex items-center gap-1.5">
              <span class="text-lg font-black tracking-tight text-white">
                Short<span class="text-rose-500">link</span>
              </span>
            </div>
            <p class="text-[11px] text-zinc-400 flex items-center gap-1 mt-0.5 font-bold">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="statusDot"></span>
              <span class="text-emerald-400" id="statusText">Live Firestore</span>
            </p>
          </div>
        </div>
        <button id="btnToggleSidebar" title="Collapse Sidebar" class="p-2 rounded-xl text-zinc-400 hover:text-white hover:bg-zinc-900 transition-all flex-shrink-0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><line x1="18" y1="15" x2="6" y2="15"/><line x1="18" y1="9" x2="6" y2="9"/><line x1="18" y1="6" x2="6" y2="6"/></svg>
        </button>
      </div>

      <span class="text-[10px] font-black uppercase tracking-widest text-zinc-500 px-3">Navigation</span>
      <nav class="mt-2 space-y-1" id="sidebarNav"></nav>
    </div>

    <div class="nav-divider"></div>
    <a href="/" class="nav-link" id="navVisitSite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
      Visit Site
    </a>

    <div class="sidebar-footer">
      <div style="margin-bottom:6px; font-family: var(--font-mono); font-size: 11px; font-weight: 700;">shortlink-data</div>
      <div style="font-family: var(--font-mono); font-size: 11px; color: var(--muted);">Firebase · KV stats</div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main" id="main">
    <header class="topbar" id="topbar"></header>

    <div class="page-container" id="pageContainer"></div>
  </main>
</div>

<!-- Refresh toast -->
<div class="refresh-banner" id="refreshBanner">
  <div class="dot"></div>
  <span id="refreshText">Refreshing stats&hellip;</span>
</div>

</body>
</html>
