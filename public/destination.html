<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Final destination page" />
  <title>Shortlink — Destination</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="logo">Short<span class="accent">link</span></div>
    </div>
  </header>

  <main class="page-body">
    <div class="container">
      <div class="dest-card">
        <div class="emoji">🎯</div>
        <h2>You&rsquo;ve arrived!</h2>
        <p id="dest-message">This is the final destination page.</p>

        <div class="dest-links">
          <a href="index.html" class="btn btn-outline">Create another short link</a>
          <a href="/Admin" class="btn btn-primary">Admin dashboard</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Shortlink. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Track arrival at final destination (fire-and-forget)
    (function () {
      try {
        fetch("/api/track", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: "page_view",
            path: window.location.pathname,
          }),
        });
      } catch (e) {
        // Tracking failures should never break the UI
      }
    })();
  </script>
</body>
</html>
