<style>
  /* Final page — minimal, clean, matches romance theme */
  :root{
    --night:#1b0d1a;
    --night-2:#2a1226;
    --wine:#5b1431;
    --rose:#e8587a;
    --rose-deep:#c43560;
    --blush:#f8dce3;
    --cream:#fff4ef;
    --gold:#f2c47d;
    --ink:#3a2133;
    --muted:#b79aaa;
    --radius:22px;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Nunito Sans","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--blush);
    background:
      radial-gradient(1100px 600px at 80% -10%,rgba(232,88,122,.22),transparent 60%),
      radial-gradient(900px 600px at -10% 20%,rgba(242,196,125,.10),transparent 60%),
      var(--night);
    background-attachment:fixed;
    line-height:1.7;
    min-height:100vh;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .site-header{
    position:sticky;top:0;z-index:50;
    background:rgba(27,13,26,.82);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(248,220,227,.10);
  }
  .site-header .inner{
    max-width:880px;margin:0 auto;padding:12px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .site-logo{font-family:var(--serif);font-size:24px;font-weight:600;color:#fff;letter-spacing:.2px}
  .site-logo .accent{color:var(--rose);font-style:italic}
  .wrap{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:0 18px}
  .final-card{
    margin:60px auto 0;padding:56px 26px;text-align:center;
    border-radius:var(--radius);overflow:hidden;
    background:linear-gradient(160deg,var(--wine),#2b0f24 70%);
    border:1px solid rgba(248,220,227,.14);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.8);
  }
  .final-heart{width:64px;height:64px;margin:0 auto 20px;filter:drop-shadow(0 6px 18px rgba(232,88,122,.65))}
  .final-card h1{font-family:var(--serif);font-weight:600;font-style:italic;font-size:clamp(28px,6vw,42px);line-height:1.12;color:#fff;margin:0 0 14px}
  .final-card p{font-size:clamp(16px,2.4vw,19px);color:var(--blush);max-width:34em;margin:0 auto 26px}
  .btn-final{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    min-height:54px;padding:14px 34px;border-radius:999px;
    font-size:18px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#ff7d9b 0%,var(--rose) 45%,var(--rose-deep) 100%);
    box-shadow:0 12px 28px -10px rgba(232,88,122,.8);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn-final:hover{transform:translateY(-2px);box-shadow:0 16px 34px -10px rgba(232,88,122,.95)}
  .page-footer{position:relative;z-index:2;margin-top:44px;padding:28px 18px 110px;text-align:center;font-size:14px;color:var(--muted)}
  .page-footer a{color:var(--blush);margin:0 8px;text-decoration:underline;text-underline-offset:3px;opacity:.85}
  .page-footer a:hover{opacity:1}
</style>
</head>
