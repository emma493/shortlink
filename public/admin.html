<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Shortlink admin dashboard" />
  <title>Shortlink — Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="logo">Short<span class="accent">link</span></div>
      <a href="index.html" class="btn btn-outline btn-sm">Back to pages</a>
    </div>
  </header>

  <main class="page-body">
    <div class="container">
      <div class="admin-card">
        <div class="admin-header">
          <div>
            <h2>Admin Dashboard</h2>
            <p style="font-size:0.875rem; color:#64748b;">Read-only visitor statistics.</p>
          </div>
          <button type="button" id="refresh-btn" class="btn btn-outline btn-sm">Refresh</button>
        </div>

        <div class="admin-stats">
          <div class="admin-stat">
            <span class="admin-stat-value" id="stat-total-views">0</span>
            <span class="admin-stat-label">Total Page Views</span>
          </div>
          <div class="admin-stat">
            <span class="admin-stat-value" id="stat-total-pages">0</span>
            <span class="admin-stat-label">Pages Visited</span>
          </div>
          <div class="admin-stat">
            <span class="admin-stat-value" id="stat-top-page">—</span>
            <span class="admin-stat-label">Most Visited Page</span>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Page</th>
                <th>Views</th>
                <th>Last Visit</th>
              </tr>
            </thead>
            <tbody id="pages-table-body">
              <!-- rows injected by JS -->
            </tbody>
          </table>
        </div>

        <div style="margin-top:2rem;">
          <h3 style="font-size:1rem; font-weight:600; color:#0f172a; margin-bottom:0.75rem;">Recent Visitor Activity</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Page</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody id="events-table-body">
                <!-- rows injected by JS -->
              </tbody>
            </table>
          </div>
        </div>

        <div id="admin-empty" class="empty-state" style="display:none;">
          <p>No visitor data yet. Visit the pages to generate statistics.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Shortlink. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/admin.js"></script>
</body>
</html>
