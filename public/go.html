<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Redirecting to destination" />
  <title>Shortlink — Redirecting&hellip;</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="logo">Short<span class="accent">link</span></div>
    </div>
  </header>

  <main class="page-body">
    <div class="container">
      <div class="go-wrapper">
        <div class="go-card">
          <div class="go-header">
            <h2>Almost there</h2>
            <p id="dest-text">You&rsquo;ll be redirected to the destination in a few seconds.</p>
          </div>

          <div class="timer-badge" id="timer">5</div>
          <div class="countdown-bar">
            <div class="countdown-bar-fill" id="progress-bar"></div>
          </div>

          <button type="button" id="continue-btn" class="btn btn-outline">
            Continue to destination
          </button>

          <div class="go-footer">
            Shortlink &middot; Redirecting you safely
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Shortlink. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/go.js"></script>
</body>
</html>
