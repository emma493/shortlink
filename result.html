<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Your shortened link is ready" />
  <title>Shortlink — Link created</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="logo">Short<span class="accent">link</span></div>
      <nav class="nav-links">
        <a href="#">Features</a>
        <a href="#">Pricing</a>
        <a href="#">About</a>
      </nav>
    </div>
  </header>

  <main class="page-body">
    <div class="container">
      <section class="result-header">
        <div class="icon">🔗</div>
        <h1>Your short link is ready</h1>
        <p>Copy it and share it anywhere.</p>
      </section>

      <div class="result-card">
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-value">0</span>
            <span class="stat-label">Clicks</span>
          </div>
          <div class="stat-card">
            <span class="stat-value">0</span>
            <span class="stat-label">Today</span>
          </div>
          <div class="stat-card">
            <span class="stat-value">—</span>
            <span class="stat-label">Created just now</span>
          </div>
        </div>

        <div class="link-display">
          <input type="text" id="short-link" readonly />
          <button type="button" id="copy-btn" class="btn btn-primary btn-sm">
            Copy
          </button>
        </div>

        <div class="link-actions">
          <button type="button" id="new-shorten-btn" class="btn btn-outline">
            Shorten another link
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Shortlink. All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/js/result.js"></script>
</body>
</html>
